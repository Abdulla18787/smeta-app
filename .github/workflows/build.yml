name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyni yuklash
      uses: actions/checkout@v4

    - name: Java 17 sozlash
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Python 3.10 sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kutubxonalarni o'rnatish va urllib ni sozlash
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev lld build-essential
        python3 -m pip install --upgrade pip
        python3 -m pip install "Cython<3.0" buildozer virtualenv
        
        # urllib so'rovlariga rasmiy brauzer User-Agent ni biriktirish
        SITE_DIR=$(python3 -c "import site; print(site.getsitepackages()[0])")
        cat << 'EOF' > "$SITE_DIR/sitecustomize.py"
        import urllib.request
        opener = urllib.request.build_opener()
        opener.addheaders = [('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36')]
        urllib.request.install_opener(opener)
        EOF

    - name: Buildozer orqali APK yig'ish
      run: |
        yes | buildozer -v android debug

    - name: APK faylni saqlash
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ProrabSmeta-APK
        path: bin/*.apk
