name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Repozitoriyni yuklash
      uses: actions/checkout@v4

    - name: Java 17 sozlash
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Python 3.10 sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Tizim kutubxonalarini o'rnatish
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev lld
        python3 -m pip install --upgrade pip
        python3 -m pip install "Cython<3.0" buildozer virtualenv

    - name: Buildozer orqali APK yig'ish
      run: |
        yes | buildozer -v android debug

    - name: APK faylni saqlab olish
      uses: actions/upload-artifact@v4
      with:
        name: ProrabSmeta-APK
        path: bin/*.apk
